[package]
name = "mluau-require"
version = "0.1.0"
edition = "2024"

[dependencies]
mluau = { git = "https://github.com/mluau/mluau" }
log = { version = "0.4", optional = true }
rust-embed = { version = "8", features = ["interpolate-folder-path"], optional = true }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = { version = "2.12.1", features = ["serde"] }
log = "0.4"
env_logger = "0.11.8"

[features]
default = ["rust-embed"]
log = ["dep:log"]
rust-embed = ["dep:rust-embed"]